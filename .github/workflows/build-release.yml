name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag must match package.json: v${version}`);
          }
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: threet-extension
          path: build/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: threet-extension
          path: release
      - name: Publish release with extension ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Download the **threet-v*.zip** asset below (not GitHub's source code archives).

          1. Extract the ZIP into a folder you will keep.
          2. Open `chrome://extensions` and enable **Developer mode**.
          3. Click **Load unpacked** and select the extracted folder containing `manifest.json`.
          4. Open https://www.threads.com.

          To update, replace the files in your existing extension folder with the new ZIP contents, then click **Reload** on the extension and reload your Threads tabs.
          EOF
          gh release create "$RELEASE_TAG" "release/threet-${RELEASE_TAG}.zip" \
            --verify-tag --title "threet ${RELEASE_TAG}" \
            --generate-notes --notes-file release-notes.md
